spring.application.name=thryveai-backend
server.port=8080

spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

# Google OAuth2
spring.security.oauth2.client.registration.google.scope=email,profile
